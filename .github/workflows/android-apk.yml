name: Build Android APK

# Builds an installable debug APK for testing and publishes it as a workflow
# artifact. Debug APKs are signed with the Android debug keystore, which is
# enough to sideload for testing but NOT for Play Store upload.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API URL (overrides the VITE_API_URL repo variable)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Capacitor 8 requires JDK 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Installs cmdline-tools and accepts licences so Gradle can pull down
      # compileSdk 36 if the runner image does not already have it.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        env:
          # Falls back to the repo variable when the manual input is empty.
          # The APK cannot use a relative "/api" — it has no backend origin.
          VITE_API_URL: ${{ inputs.api_url || vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::VITE_API_URL is not set. Add it under Settings → Secrets and variables → Actions → Variables, or pass it as a workflow input. Without it the APK cannot reach the backend."
            exit 1
          fi
          echo "Building against API: $VITE_API_URL"
          npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: frontend/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dairyflow-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
