name: CI

# Validates every branch and every PR into main.
#
# Railway's "Wait for CI" is enabled on this repo, so a red run here blocks the
# production deploy. That is the point: main should only reach Railway when the
# backend tests pass and both halves still compile.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A newer push to the same branch makes the older run irrelevant — cancel it so
# feedback stays fast and Railway is not waiting on a stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The suite is self-contained (unit + slice tests, no live database), so it
      # needs no services. If an integration test ever needs Postgres, add it as a
      # service container here rather than pointing CI at the deployed database.
      - name: Run tests
        run: mvn -B test
        working-directory: backend

      # Surfaces which test failed without digging through the raw log.
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # No VITE_API_URL here on purpose: this job only proves the app still
      # compiles. The API base falls back to the relative "/api" used by the web
      # build. The APK workflow is where the absolute URL matters.
      - name: Build
        run: npm run build
        working-directory: frontend
