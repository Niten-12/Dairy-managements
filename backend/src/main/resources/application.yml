spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dairy_management}
    username: ${SPRING_DATASOURCE_USERNAME:dairy_user}
    password: ${SPRING_DATASOURCE_PASSWORD:dairy_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    # Schema is owned by Flyway (src/main/resources/db/migration).
    # validate = startup FAILS LOUDLY if entities and schema drift apart,
    # instead of the old ddl-auto=update silently booting on a broken schema.
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    # baseline-on-migrate only acts on a NON-EMPTY schema that has no
    # flyway_schema_history table: it records a baseline marker at version 1
    # (skipping V1__baseline_schema.sql, which mirrors that pre-existing
    # schema) and then applies V2+. A genuinely EMPTY database is never
    # baselined — it runs V1, V2, ... from scratch. Trade-off: a non-empty
    # schema missing its history table is assumed to be the pre-Flyway
    # production schema rather than an error.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: pre-flyway schema (ddl-auto era)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  upload-dir: ${UPLOAD_DIR:uploads}
  cors:
    # Comma-separated. Must include the Capacitor APK origin (https://localhost)
    # for the Android build to reach the API. See CorsConfig for the full list.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://localhost,capacitor://localhost}
  seed:
    # The bootstrap ADMIN account. Defaults are fine locally, but ANY public
    # deployment must override ADMIN_PASSWORD — the default is in the repo.
    # Only applied when no user with this email exists yet; changing the
    # password here does NOT rotate an already-seeded account.
    admin-email: ${ADMIN_EMAIL:admin@dairy.com}
    admin-password: ${ADMIN_PASSWORD:admin123}
  auth:
    # DEV ONLY: when true, /api/auth/otp/send includes the OTP in the response
    # body (for local setups without a real SMS provider). Fail-closed default.
    # NEVER set APP_EXPOSE_DEV_OTP=true in production.
    expose-dev-otp: ${APP_EXPOSE_DEV_OTP:false}

server:
  # Railway (and most PaaS hosts) inject the port to bind on via PORT.
  # Local runs and docker-compose have no PORT set and keep using 8080.
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:dairy-super-secret-jwt-key-change-in-production-min-32-chars}
  expiration: ${JWT_EXPIRATION:86400000}

fast2sms:
  api-key: ${FAST2SMS_API_KEY:CHANGE_ME}

logging:
  level:
    com.dairy: DEBUG
